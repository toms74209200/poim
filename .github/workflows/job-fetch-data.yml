name: Job - Fetch Data

on:
  workflow_call:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: data
          key: ${{ runner.os }}-japan1-${{ hashFiles('scripts/fetch_japan1.sh') }}
      - name: Fetch mapping resource
        run: scripts/fetch_japan1.sh
      - uses: actions/upload-artifact@v7
        with:
          name: japan1-data
          path: data
