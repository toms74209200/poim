name: Job - Test Large

on:
  workflow_call:
    inputs:
      frontend:
        description: 'Frontend under test'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/acceptance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: japan1-data
          path: data
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build wasm
        if: inputs.frontend == 'wasm'
        working-directory: .
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release
      - name: Build CLI
        if: inputs.frontend == 'cli'
        working-directory: .
        run: cargo build --release
      - uses: actions/cache@v5
        with:
          path: tests/acceptance/.cache
          key: ${{ runner.os }}-reference-epub-${{ hashFiles('tests/acceptance/lib/reference_epub.py') }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync
      - name: Run acceptance tests
        run: uv run pytest -vv --frontend=${{ inputs.frontend }}
