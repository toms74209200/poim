name: On Pull Request(Rust)
on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'scripts/**'
      - '.github/workflows/on-pullrequest-rs.yml'

jobs:
  fetch-data:
    uses: ./.github/workflows/job-fetch-data.yml
  lint:
    needs: fetch-data
    uses: ./.github/workflows/job-lint.yml
    permissions:
      contents: write
  small-test:
    needs: fetch-data
    uses: ./.github/workflows/job-test-small.yml
    with:
      with-coverage: true
  coverage:
    needs:
      - small-test
    uses: ./.github/workflows/job-coverage.yml
    with:
      coverage-threshold: 80
  large-test:
    needs:
      - small-test
    strategy:
      matrix:
        frontend: [wasm, cli]
    uses: ./.github/workflows/job-test-large.yml
    with:
      frontend: ${{ matrix.frontend }}
